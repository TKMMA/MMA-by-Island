<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawaii Regulated Areas Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="map-interface">
    <aside id="map-sidebar" class="map-sidebar">
        <div class="sidebar-header">
            <div class="header-top">
                <h2>Regulated Areas</h2>
                <button onclick="toggleSidebar()" class="sidebar-toggle-btn" title="Toggle Sidebar">◀</button>
            </div>
            
            <div class="search-box">
                <div class="search-input-wrapper">
                    <input type="text" id="area-search" placeholder="Search areas..." onkeyup="filterSidebar()">
                    <span class="search-icon">🔍</span>
                </div>
            </div>
        </div>

        <div id="island-list" class="island-list">
            <div class="loading-notice">Loading Marine Areas...</div>
        </div>
    </aside>

    <aside id="info-sidebar" class="info-sidebar">
        <button onclick="closeInfoPanel()" class="close-info-btn" title="Close Details">✕</button>
        <div id="info-content" class="info-content"></div>
    </aside>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
